server:
  port: ${SERVER_PORT:8082}

spring:
  datasource:
    url: jdbc:mysql://localhost:3308/plip_user?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  instance:
    prefer-ip-address: false
    hostname: localhost
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
