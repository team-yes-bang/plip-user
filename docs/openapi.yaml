openapi: 3.1.0
info:
  title: PLIP User Service API
  description: 유저 서비스 API 명세서
  version: v1.0.0
servers:
- url: http://localhost
  description: Generated server url
tags:
- name: Auth - Email OTP
  description: 이메일 OTP 인증 API
- name: Auth - Signup & Social Login
  description: 회원가입 및 소셜 로그인 API
paths:
  /api/v1/auth/signup/local:
    post:
      tags:
      - Auth - Signup & Social Login
      summary: 이메일 회원가입
      description: 이메일 인증 완료 후 회원가입을 진행합니다.
      operationId: signupLocal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalSignupRequest"
        required: true
      responses:
        "201":
          description: 회원가입 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LocalSignupResponse"
        "400":
          description: "인증 토큰 무효, 필수 약관 미동의, 닉네임 형식 오류"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 이미 가입된 이메일
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login/social/{provider}:
    post:
      tags:
      - Auth - Signup & Social Login
      summary: 소셜 로그인
      description: 소셜 제공자의 액세스 토큰으로 로그인합니다. 닉네임과 프로필 이미지는 소셜 제공자에서 자동 수집됩니다. 신규 사용자는
        약관 동의가 필요합니다.
      operationId: socialLogin
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialLoginRequest"
        required: true
      responses:
        "200":
          description: 로그인/가입 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SocialLoginResponse"
        "401":
          description: 소셜 인증 실패
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 신규 사용자 — 약관 동의 필요
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/email/otp-verify:
    post:
      tags:
      - Auth - Email OTP
      summary: OTP 검증
      description: 발송된 인증번호를 검증하고 Verification Token을 반환합니다.
      operationId: verifyOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailOtpVerifyRequest"
        required: true
      responses:
        "200":
          description: 인증 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmailOtpVerifyResponse"
        "400":
          description: 인증번호 불일치 또는 만료
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/email/otp-request:
    post:
      tags:
      - Auth - Email OTP
      summary: OTP 발송 요청
      description: 입력된 이메일로 6자리 인증번호를 발송합니다.
      operationId: requestOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailOtpRequest"
        required: true
      responses:
        "200":
          description: 인증번호 발송 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmailOtpRequestResponse"
        "429":
          description: 요청 횟수 초과
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    LocalSignupRequest:
      type: object
      description: 이메일 회원가입 요청
      properties:
        email:
          type: string
          format: email
          description: 가입 이메일
          example: user@example.com
          minLength: 1
        verificationToken:
          type: string
          description: 이메일 인증 완료 토큰
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          minLength: 1
        password:
          type: string
          description: 비밀번호
          example: password123!
          maxLength: 64
          minLength: 8
        nickname:
          type: string
          description: 닉네임
          example: 플립이
          maxLength: 12
          minLength: 2
        termsAgreements:
          type: array
          description: 약관 동의 목록 (필수 약관이 있을 경우 필수)
          items:
            $ref: "#/components/schemas/TermAgreementRequest"
      required:
      - email
      - nickname
      - password
      - verificationToken
    TermAgreementRequest:
      type: object
      description: 약관 동의 항목
      properties:
        termId:
          type: integer
          format: int64
          description: 약관 ID
          example: 1
        agreed:
          type: boolean
          description: 동의 여부
          example: true
      required:
      - agreed
      - termId
    ErrorResponse:
      type: object
      description: 에러 응답
      properties:
        code:
          type: string
          description: 에러 코드
          example: OTP_001
        message:
          type: string
          description: 에러 메시지
          example: 요청 횟수가 제한을 초과했습니다.
    LocalSignupResponse:
      type: object
      description: 이메일 회원가입 응답
      properties:
        userUuid:
          type: string
          description: 사용자 UUID
          example: 01912345-6789-7abc-def0-123456789abc
        message:
          type: string
          description: 결과 메시지
          example: 회원가입이 완료되었습니다.
    SocialLoginRequest:
      type: object
      description: 소셜 로그인 요청
      properties:
        accessToken:
          type: string
          description: 소셜 제공자의 액세스 토큰
          example: ya29.a0AfH6SM...
          minLength: 1
        termsAgreements:
          type: array
          description: 약관 동의 목록 (신규 가입 시 필수)
          items:
            $ref: "#/components/schemas/TermAgreementRequest"
      required:
      - accessToken
    SocialLoginResponse:
      type: object
      description: 소셜 로그인 응답
      properties:
        userUuid:
          type: string
          description: 사용자 UUID
          example: 01912345-6789-7abc-def0-123456789abc
        newUser:
          type: boolean
          description: 신규 가입 여부
          example: false
    EmailOtpVerifyRequest:
      type: object
      description: 이메일 OTP 검증 요청
      properties:
        email:
          type: string
          format: email
          description: 인증 대상 이메일
          example: user@example.com
          minLength: 1
        otpCode:
          type: string
          description: 6자리 인증번호
          example: "123456"
          maxLength: 6
          minLength: 6
      required:
      - email
      - otpCode
    EmailOtpVerifyResponse:
      type: object
      description: 이메일 OTP 검증 응답
      properties:
        verificationToken:
          type: string
          description: 이메일 인증 완료 토큰 (회원가입 시 사용)
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    EmailOtpRequest:
      type: object
      description: 이메일 OTP 발송 요청
      properties:
        email:
          type: string
          format: email
          description: 인증 대상 이메일
          example: user@example.com
          minLength: 1
      required:
      - email
    EmailOtpRequestResponse:
      type: object
      description: 이메일 OTP 발송 응답
      properties:
        message:
          type: string
          description: 결과 메시지
          example: 인증번호가 발송되었습니다.
