openapi: 3.1.0
info:
  title: PLIP User Service API
  description: 유저 서비스 API 명세서
  version: v1.0.0
servers:
- url: http://localhost
  description: Generated server url
tags:
- name: Auth - Email OTP
  description: 이메일 OTP 인증 API
paths:
  /api/v1/auth/email/otp-verify:
    post:
      tags:
      - Auth - Email OTP
      summary: OTP 검증
      description: 발송된 인증번호를 검증하고 Verification Token을 반환합니다.
      operationId: verifyOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailOtpVerifyRequest"
        required: true
      responses:
        "200":
          description: 인증 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmailOtpVerifyResponse"
        "400":
          description: 인증번호 불일치 또는 만료
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/email/otp-request:
    post:
      tags:
      - Auth - Email OTP
      summary: OTP 발송 요청
      description: 입력된 이메일로 6자리 인증번호를 발송합니다.
      operationId: requestOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailOtpRequest"
        required: true
      responses:
        "200":
          description: 인증번호 발송 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmailOtpRequestResponse"
        "429":
          description: 요청 횟수 초과
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    EmailOtpVerifyRequest:
      type: object
      description: 이메일 OTP 검증 요청
      properties:
        email:
          type: string
          format: email
          description: 인증 대상 이메일
          example: user@example.com
          minLength: 1
        otpCode:
          type: string
          description: 6자리 인증번호
          example: "123456"
          maxLength: 6
          minLength: 6
      required:
      - email
      - otpCode
    ErrorResponse:
      type: object
      description: 에러 응답
      properties:
        code:
          type: string
          description: 에러 코드
          example: OTP_001
        message:
          type: string
          description: 에러 메시지
          example: 요청 횟수가 제한을 초과했습니다.
    EmailOtpVerifyResponse:
      type: object
      description: 이메일 OTP 검증 응답
      properties:
        verificationToken:
          type: string
          description: 이메일 인증 완료 토큰 (회원가입 시 사용)
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    EmailOtpRequest:
      type: object
      description: 이메일 OTP 발송 요청
      properties:
        email:
          type: string
          format: email
          description: 인증 대상 이메일
          example: user@example.com
          minLength: 1
      required:
      - email
    EmailOtpRequestResponse:
      type: object
      description: 이메일 OTP 발송 응답
      properties:
        message:
          type: string
          description: 결과 메시지
          example: 인증번호가 발송되었습니다.
