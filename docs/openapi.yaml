openapi: 3.1.0
info:
  title: PLIP User Service API
  description: 유저 서비스 API 명세서
  version: v1.0.0
servers:
- url: http://localhost
  description: Generated server url
tags:
- name: Auth - Email OTP
  description: 이메일 OTP 인증 API
- name: Auth - Terms
  description: 가입·마이페이지 약관 API
- name: Auth - Signup & Login
  description: 회원가입·로그인·로그아웃·비밀번호 재설정 API
- name: Users - Me
  description: 마이페이지 API
- name: Auth - Token & Account
  description: JWT 토큰 재발급·탈퇴 계정 복구 API
paths:
  /api/v1/auth/social/signup/complete:
    post:
      tags:
      - Auth - Signup & Login
      summary: 소셜 가입 완료
      description: pending 토큰과 약관 동의로 신규 소셜 가입을 완료하고 JWT를 발급합니다.
      operationId: completeSocialSignup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialSignupCompleteRequest"
        required: true
      responses:
        "200":
          description: 가입 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SocialLoginResponse"
        "400":
          description: pending 토큰 무효 또는 필수 약관 미동의
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/social/signup-pending:
    post:
      tags:
      - Auth - Signup & Login
      summary: 소셜 가입 pending 저장
      description: 신규 소셜 사용자(SOCIAL_003)의 제공자 액세스 토큰을 Redis에 임시 저장하고 pending 토큰을 반환합니다.
      operationId: saveSocialSignupPending
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialSignupPendingRequest"
        required: true
      responses:
        "200":
          description: 저장 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SocialSignupPendingResponse"
        "400":
          description: 입력값 오류
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/social/restore-pending:
    post:
      tags:
      - Auth - Token & Account
      summary: 소셜 복구 pending
      description: 소셜 로그인 AUTH_010 응답 후 Redis pending 토큰으로 계정을 복구하고 JWT를 재발급합니다.
      operationId: restoreSocialFromPending
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialRestorePendingRequest"
        required: true
      responses:
        "200":
          description: 복구 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountRestoreResponse"
        "400":
          description: pending 토큰 무효 또는 복구 대상 아님
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 유예 기간 만료
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/signup/local:
    post:
      tags:
      - Auth - Signup & Login
      summary: 이메일 회원가입
      description: 이메일 인증 완료 후 회원가입을 진행합니다.
      operationId: signupLocal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalSignupRequest"
        required: true
      responses:
        "201":
          description: 회원가입 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LocalSignupResponse"
        "400":
          description: "인증 토큰 무효, 필수 약관 미동의, 닉네임 형식 오류"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 이미 가입된 이메일
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/restore/social/{provider}:
    post:
      tags:
      - Auth - Token & Account
      summary: 소셜 계정 복구
      description: 탈퇴 유예 기간(30일) 내 DELETED 계정을 소셜 액세스 토큰으로 복구하고 JWT를 재발급합니다. 소셜 로그인
        시 AUTH_010 응답 후 본 API 호출. JWT 불필요(public).
      operationId: restoreSocial
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialRestoreRequest"
        required: true
      responses:
        "200":
          description: 복구 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountRestoreResponse"
        "400":
          description: 복구 대상 아님
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 소셜 인증 실패
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 유예 기간 만료
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/restore/local:
    post:
      tags:
      - Auth - Token & Account
      summary: 로컬 계정 복구
      description: 탈퇴 유예 기간(30일) 내 DELETED 계정을 이메일·비밀번호로 복구하고 JWT를 재발급합니다. 로그인 시 AUTH_010
        응답 후 본 API 호출. JWT 불필요(public).
      operationId: restoreLocal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalLoginRequest"
        required: true
      responses:
        "200":
          description: 복구 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountRestoreResponse"
        "400":
          description: 복구 대상 아님
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 이메일 또는 비밀번호 불일치
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 유예 기간 만료
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/reissue:
    post:
      tags:
      - Auth - Token & Account
      summary: 토큰 재발급
      description: 리프레시 토큰으로 액세스·리프레시 토큰을 재발급합니다 (RTR).
      operationId: reissue
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenReissueRequest"
        required: true
      responses:
        "200":
          description: 재발급 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenReissueResponse"
        "401":
          description: 리프레시 토큰 무효
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 비활성화된 계정
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/password-reset:
    post:
      tags:
      - Auth - Signup & Login
      summary: 비밀번호 재설정
      description: 이메일 OTP 인증 후 비밀번호를 재설정합니다.
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
        required: true
      responses:
        "200":
          description: 재설정 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PasswordResetResponse"
        "400":
          description: "인증 토큰 무효, 기존 비밀번호와 동일"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 비활성화된 계정
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/logout:
    post:
      tags:
      - Auth - Signup & Login
      summary: 로그아웃
      description: 리프레시 토큰을 무효화하고 user.logout Kafka 이벤트를 발행합니다. 액세스 토큰은 TTL 만료까지 stateless
        유효.
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
        required: true
      responses:
        "200":
          description: 로그아웃 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          description: 리프레시 토큰 무효
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login/social/{provider}:
    post:
      tags:
      - Auth - Signup & Login
      summary: 소셜 로그인
      description: 소셜 제공자의 액세스 토큰으로 로그인합니다. 기존 가입 사용자(provider+providerUserId 일치)는
        약관 없이 JWT를 발급하며 응답 newUser=false. 신규 사용자는 약관 동의 후 가입·JWT 발급(newUser=true).
        닉네임은 신규 가입 시 소셜 제공자에서 자동 수집됩니다.
      operationId: socialLogin
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialLoginRequest"
        required: true
      responses:
        "200":
          description: 로그인/가입 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SocialLoginResponse"
        "401":
          description: 소셜 인증 실패
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: 신규 사용자 — 약관 동의 필요
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login/local:
    post:
      tags:
      - Auth - Signup & Login
      summary: 로컬 로그인
      description: 이메일과 비밀번호로 로그인하고 JWT를 발급합니다.
      operationId: loginLocal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalLoginRequest"
        required: true
      responses:
        "200":
          description: 로그인 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LocalLoginResponse"
        "401":
          description: 이메일 또는 비밀번호 불일치
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 비활성화된 계정
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/email/otp-verify:
    post:
      tags:
      - Auth - Email OTP
      summary: OTP 검증
      description: 발송된 인증번호를 검증하고 Verification Token을 반환합니다.
      operationId: verifyOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailOtpVerifyRequest"
        required: true
      responses:
        "200":
          description: 인증 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmailOtpVerifyResponse"
        "400":
          description: 인증번호 불일치 또는 만료
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/email/otp-request:
    post:
      tags:
      - Auth - Email OTP
      summary: OTP 발송 요청
      description: "입력된 이메일로 6자리 인증번호를 Gmail SMTP로 발송합니다. purpose=SIGNUP은 미가입 이메일만\
        , PASSWORD_RESET은 기존 LOCAL 계정 이메일만 발송합니다."
      operationId: requestOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailOtpRequest"
        required: true
      responses:
        "200":
          description: 인증번호 발송 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmailOtpRequestResponse"
        "429":
          description: 요청 횟수 초과
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/users/me/terms-agreements:
    get:
      tags:
      - Users - Me
      summary: 유저 약관 동의 상태 조회
      description: ACTIVE 약관 목록과 로그인 사용자의 동의·철회 상태를 함께 반환합니다.
      operationId: getAgreements
      responses:
        "200":
          description: 조회 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserTermsAgreementsListResponse"
        "401":
          description: 인증 실패
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 사용자 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
    patch:
      tags:
      - Users - Me
      summary: 선택 약관 동의·철회
      description: 로그인 사용자의 선택(비필수) 약관 동의 상태를 변경합니다. 토글 변경 시 항목 1건만 전달합니다. 필수 약관 철회는
        거부됩니다.
      operationId: updateAgreements
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermsAgreementsUpdateRequest"
        required: true
      responses:
        "200":
          description: 변경 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TermsAgreementsUpdateResponse"
        "400":
          description: 필수 약관 철회·약관 없음·항목 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 인증 실패
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 사용자 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/v1/users/me/profile:
    patch:
      tags:
      - Users - Me
      summary: 프로필 수정
      description: "닉네임·프로필 이미지 경로를 부분 수정합니다. 미전달 필드는 유지하고, profileImagePath에 빈 문자\
        열을 보내면 이미지를 제거합니다. 실제 이미지 파일 업로드는 별도 스토리지(S3/CDN)에서 수행합니다."
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
        required: true
      responses:
        "200":
          description: 수정 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "400":
          description: 닉네임·경로 형식 오류 또는 수정 항목 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 인증 실패
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/v1/users/me/password:
    patch:
      tags:
      - Users - Me
      summary: 비밀번호 변경
      description: 로그인한 사용자의 비밀번호를 변경합니다. 기존 비밀번호와 동일한 비밀번호는 사용할 수 없습니다. 변경 성공 시 Redis
        Refresh Token 전량 파기 후 새 Access/Refresh JWT 발급. 기존 Access JWT는 TTL 만료까지 stateless
        유효(실무 표준). 클라이언트는 응답 JWT로 교체 권장.
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
        required: true
      responses:
        "200":
          description: 변경 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PasswordChangeResponse"
        "400":
          description: 기존 비밀번호와 동일
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 인증 실패 또는 현재 비밀번호 불일치
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/v1/users/me/notification-settings:
    get:
      tags:
      - Users - Me
      summary: 알림 설정 조회
      description: 로그인 사용자의 아지트·다이어리 알림 설정을 조회합니다.
      operationId: getNotificationSettings
      responses:
        "200":
          description: 조회 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NotificationSettingsResponse"
        "401":
          description: 인증 실패
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 사용자 또는 알림 설정 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
    patch:
      tags:
      - Users - Me
      summary: 알림 설정 수정
      description: "전달한 필드만 수정합니다. 토글 변경 시 해당 boolean 필드만, 다이어리 알림 시각은 diaryNotifyTime만\
        \ 전달합니다. 저장 성공 후 user.notification-setting-updated Kafka 이벤트를 발행합니다."
      operationId: patchNotificationSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSettingsPatchRequest"
        required: true
      responses:
        "200":
          description: 수정 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NotificationSettingsResponse"
        "400":
          description: 입력값 오류 또는 수정 항목 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 인증 실패
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 사용자 또는 알림 설정 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/v1/users/me:
    get:
      tags:
      - Users - Me
      summary: 프로필 조회
      description: 로그인한 사용자의 프로필 정보를 조회합니다. 아지트 입장 시 기본 프로필로 사용됩니다.
      operationId: getProfile
      responses:
        "200":
          description: 조회 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          description: 인증 실패
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 비활성화된 계정
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 사용자 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Users - Me
      summary: 회원탈퇴
      description: 계정을 DELETED 상태로 전환하고 30일 유예 기간을 시작합니다. Redis Refresh Token 전량 파기.
      operationId: withdraw
      responses:
        "200":
          description: 탈퇴 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserWithdrawResponse"
        "401":
          description: 인증 실패
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 비활성화된 계정
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 사용자 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/v1/auth/terms:
    get:
      tags:
      - Auth - Terms
      summary: ACTIVE 약관 목록
      description: 가입·소셜 약관 동의 UI용 ACTIVE 약관 목록. term_code당 version(major.minor) 최신
        ACTIVE 1건만 반환.
      operationId: getActiveTerms
      responses:
        "200":
          description: 조회 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TermsListResponse"
components:
  schemas:
    SocialSignupCompleteRequest:
      type: object
      description: 소셜 가입 완료 요청
      properties:
        pendingToken:
          type: string
          description: 소셜 가입 pending 토큰
          minLength: 1
        termsAgreements:
          type: array
          description: 약관 동의 목록
          items:
            $ref: "#/components/schemas/TermAgreementRequest"
      required:
      - pendingToken
    TermAgreementRequest:
      type: object
      description: 약관 동의 항목
      properties:
        termId:
          type: integer
          format: int64
          description: 약관 ID
          example: 1
        agreed:
          type: boolean
          description: 동의 여부
          example: true
      required:
      - agreed
      - termId
    ErrorResponse:
      type: object
      description: 에러 응답
      properties:
        code:
          type: string
          description: 에러 코드
          example: OTP_001
        message:
          type: string
          description: 에러 메시지
          example: 요청 횟수가 제한을 초과했습니다.
    SocialLoginResponse:
      type: object
      description: 소셜 로그인 응답
      properties:
        accessToken:
          type: string
          description: 액세스 토큰
        refreshToken:
          type: string
          description: 리프레시 토큰
        accessTokenExpiresIn:
          type: integer
          format: int64
          description: 액세스 토큰 만료 시간(초)
          example: 3600
        userUuid:
          type: string
          description: 사용자 UUID
          example: 01912345-6789-7abc-def0-123456789abc
        newUser:
          type: boolean
          description: 신규 가입 여부
          example: false
    SocialSignupPendingRequest:
      type: object
      description: 소셜 가입 pending 저장 요청
      properties:
        provider:
          type: string
          description: 소셜 제공자
          example: kakao
          minLength: 1
        accessToken:
          type: string
          description: 소셜 제공자 액세스 토큰
          minLength: 1
      required:
      - accessToken
      - provider
    SocialSignupPendingResponse:
      type: object
      description: 소셜 가입 pending 저장 응답
      properties:
        pendingToken:
          type: string
          description: 약관 동의 완료 전까지 유지되는 pending 토큰
        expiresInSeconds:
          type: integer
          format: int64
          description: pending 토큰 TTL(초)
    SocialRestorePendingRequest:
      type: object
      description: 소셜 복구 pending 요청
      properties:
        pendingToken:
          type: string
          description: 소셜 OAuth pending 토큰
          minLength: 1
      required:
      - pendingToken
    AccountRestoreResponse:
      type: object
      description: 계정 복구 응답
      properties:
        accessToken:
          type: string
          description: 액세스 토큰
        refreshToken:
          type: string
          description: 리프레시 토큰
        accessTokenExpiresIn:
          type: integer
          format: int64
          description: 액세스 토큰 만료 시간(초)
          example: 3600
        code:
          type: string
          description: 결과 코드
          example: USER_S002
        message:
          type: string
          description: 결과 메시지
          example: 계정이 복구되었습니다.
        userUuid:
          type: string
          description: 사용자 UUID
          example: 01912345-6789-7abc-def0-123456789abc
    LocalSignupRequest:
      type: object
      description: 이메일 회원가입 요청
      properties:
        email:
          type: string
          format: email
          description: 가입 이메일
          example: user@example.com
          minLength: 1
        verificationToken:
          type: string
          description: 이메일 인증 완료 토큰
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          minLength: 1
        password:
          type: string
          description: 비밀번호
          example: password123!
          maxLength: 64
          minLength: 8
        nickname:
          type: string
          description: 닉네임
          example: 플립이
          maxLength: 12
          minLength: 2
        termsAgreements:
          type: array
          description: 약관 동의 목록 (필수 약관이 있을 경우 필수)
          items:
            $ref: "#/components/schemas/TermAgreementRequest"
      required:
      - email
      - nickname
      - password
      - verificationToken
    LocalSignupResponse:
      type: object
      description: 이메일 회원가입 응답
      properties:
        accessToken:
          type: string
          description: 액세스 토큰
        refreshToken:
          type: string
          description: 리프레시 토큰
        accessTokenExpiresIn:
          type: integer
          format: int64
          description: 액세스 토큰 만료 시간(초)
          example: 3600
        userUuid:
          type: string
          description: 사용자 UUID
          example: 01912345-6789-7abc-def0-123456789abc
        message:
          type: string
          description: 결과 메시지
          example: 회원가입이 완료되었습니다.
    SocialRestoreRequest:
      type: object
      description: 소셜 계정 복구 요청
      properties:
        accessToken:
          type: string
          description: 소셜 제공자의 액세스 토큰
          example: ya29.a0AfH6SM...
          minLength: 1
      required:
      - accessToken
    LocalLoginRequest:
      type: object
      description: 로컬 로그인 요청
      properties:
        email:
          type: string
          format: email
          description: 로그인 이메일
          example: user@example.com
          minLength: 1
        password:
          type: string
          description: 비밀번호
          example: password123!
          maxLength: 64
          minLength: 8
      required:
      - email
      - password
    TokenReissueRequest:
      type: object
      description: 토큰 재발급 요청
      properties:
        refreshToken:
          type: string
          description: 리프레시 토큰
          minLength: 1
      required:
      - refreshToken
    TokenReissueResponse:
      type: object
      description: 토큰 재발급 응답
      properties:
        accessToken:
          type: string
          description: 액세스 토큰
        refreshToken:
          type: string
          description: 리프레시 토큰
        accessTokenExpiresIn:
          type: integer
          format: int64
          description: 액세스 토큰 만료 시간(초)
          example: 3600
    PasswordResetRequest:
      type: object
      description: 비밀번호 재설정 요청
      properties:
        email:
          type: string
          format: email
          description: 계정 이메일
          example: user@example.com
          minLength: 1
        verificationToken:
          type: string
          description: 이메일 OTP 인증 완료 토큰
          minLength: 1
        newPassword:
          type: string
          description: 새 비밀번호
          example: newPassword123!
          maxLength: 64
          minLength: 8
      required:
      - email
      - newPassword
      - verificationToken
    PasswordResetResponse:
      type: object
      description: 비밀번호 재설정 응답
      properties:
        message:
          type: string
          description: 결과 메시지
          example: 비밀번호가 재설정되었습니다.
    LogoutRequest:
      type: object
      description: 로그아웃 요청
      properties:
        refreshToken:
          type: string
          description: 리프레시 토큰
          minLength: 1
      required:
      - refreshToken
    LogoutResponse:
      type: object
      description: 로그아웃 응답
      properties:
        code:
          type: string
          description: 결과 코드
          example: AUTH_S001
        message:
          type: string
          description: 결과 메시지
          example: 로그아웃되었습니다.
    SocialLoginRequest:
      type: object
      description: 소셜 로그인 요청
      properties:
        accessToken:
          type: string
          description: 소셜 제공자의 액세스 토큰
          example: ya29.a0AfH6SM...
          minLength: 1
        termsAgreements:
          type: array
          description: 약관 동의 목록 (신규 가입 시 필수)
          items:
            $ref: "#/components/schemas/TermAgreementRequest"
      required:
      - accessToken
    LocalLoginResponse:
      type: object
      description: 로컬 로그인 응답
      properties:
        accessToken:
          type: string
          description: 액세스 토큰
        refreshToken:
          type: string
          description: 리프레시 토큰
        accessTokenExpiresIn:
          type: integer
          format: int64
          description: 액세스 토큰 만료 시간(초)
          example: 3600
        userUuid:
          type: string
          description: 사용자 UUID
          example: 01912345-6789-7abc-def0-123456789abc
    EmailOtpVerifyRequest:
      type: object
      description: 이메일 OTP 검증 요청
      properties:
        email:
          type: string
          format: email
          description: 인증 대상 이메일
          example: user@example.com
          minLength: 1
        otpCode:
          type: string
          description: 6자리 인증번호
          example: "123456"
          maxLength: 6
          minLength: 6
        purpose:
          type: string
          default: SIGNUP
          description: OTP 용도. otp-request와 동일한 값이어야 합니다.
          enum:
          - SIGNUP
          - PASSWORD_RESET
          example: SIGNUP
      required:
      - email
      - otpCode
    EmailOtpVerifyResponse:
      type: object
      description: 이메일 OTP 검증 응답
      properties:
        verificationToken:
          type: string
          description: 이메일 인증 완료 토큰 (회원가입 시 사용)
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    EmailOtpRequest:
      type: object
      description: 이메일 OTP 발송 요청
      properties:
        email:
          type: string
          format: email
          description: 인증 대상 이메일
          example: user@example.com
          minLength: 1
        purpose:
          type: string
          default: SIGNUP
          description: "OTP 용도. SIGNUP=회원가입, PASSWORD_RESET=비밀번호 재설정"
          enum:
          - SIGNUP
          - PASSWORD_RESET
          example: SIGNUP
      required:
      - email
    EmailOtpRequestResponse:
      type: object
      description: 이메일 OTP 발송 응답
      properties:
        message:
          type: string
          description: 결과 메시지
          example: 인증번호가 발송되었습니다.
    TermsAgreementsUpdateRequest:
      type: object
      description: 약관 동의 변경 요청
      properties:
        agreements:
          type: array
          description: 변경할 약관 동의 목록
          items:
            $ref: "#/components/schemas/TermAgreementRequest"
          minItems: 1
      required:
      - agreements
    TermsAgreementItemResponse:
      type: object
      description: 약관 동의 상태
      properties:
        termId:
          type: integer
          format: int64
          description: 약관 ID
          example: 3
        agreed:
          type: boolean
          description: 동의 여부
        agreedAt:
          type: string
          format: date-time
          description: 동의 시각
        revokedAt:
          type: string
          format: date-time
          description: 철회 시각
    TermsAgreementsUpdateResponse:
      type: object
      description: 약관 동의 변경 응답
      properties:
        agreements:
          type: array
          description: 변경된 약관 동의 목록
          items:
            $ref: "#/components/schemas/TermsAgreementItemResponse"
    ProfileUpdateRequest:
      type: object
      description: 프로필 수정 요청
      properties:
        nickname:
          type: string
          description: 닉네임 (선택). 미전달 시 유지
          example: 플립이
          maxLength: 12
          minLength: 2
        profileImagePath:
          type: string
          description: "프로필 이미지 상대 경로 (선택). 미전달 시 유지, 빈 문자열이면 제거"
          example: profiles/user.png
          maxLength: 255
          minLength: 0
    UserProfileResponse:
      type: object
      description: 본인 프로필 응답
      properties:
        userUuid:
          type: string
          description: 사용자 UUID
          example: 01912345-6789-7abc-def0-123456789abc
        nickname:
          type: string
          description: 닉네임
          example: 플립이
        profileImagePath:
          type: string
          description: 프로필 이미지 상대 경로
          example: profiles/user.png
        email:
          type: string
          description: 계정 이메일
          example: user@example.com
        hasLocalAuth:
          type: boolean
          description: 로컬(이메일·비밀번호) 계정 연동 여부
    PasswordChangeRequest:
      type: object
      description: 비밀번호 변경 요청
      properties:
        currentPassword:
          type: string
          description: 현재 비밀번호
          example: password123!
          minLength: 1
        newPassword:
          type: string
          description: 새 비밀번호
          example: newPassword123!
          maxLength: 64
          minLength: 8
      required:
      - currentPassword
      - newPassword
    PasswordChangeResponse:
      type: object
      description: 비밀번호 변경 응답
      properties:
        accessToken:
          type: string
          description: 액세스 토큰
        refreshToken:
          type: string
          description: 리프레시 토큰
        accessTokenExpiresIn:
          type: integer
          format: int64
          description: 액세스 토큰 만료 시간(초)
          example: 3600
        message:
          type: string
          description: 결과 메시지
          example: 비밀번호가 변경되었습니다.
    NotificationSettingsPatchRequest:
      type: object
      description: 알림 설정 수정 요청 (전달한 필드만 수정)
      properties:
        agitNotifyEnabled:
          type: boolean
          description: 아지트 알림 허용 여부 (선택). 토글 변경 시 해당 필드만 전달
          example: true
        diaryNotifyEnabled:
          type: boolean
          description: 다이어리 알림 허용 여부 (선택). 토글 변경 시 해당 필드만 전달
          example: true
        diaryNotifyTime:
          type: string
          description: 다이어리 알림 시각 (선택). 저장 버튼 클릭 시 해당 필드만 전달
          example: 21:00:00
    NotificationSettingsResponse:
      type: object
      description: 알림 설정 응답
      properties:
        agitNotifyEnabled:
          type: boolean
          description: 아지트 알림 허용 여부
        diaryNotifyEnabled:
          type: boolean
          description: 다이어리 알림 허용 여부
        diaryNotifyTime:
          type: string
          description: 다이어리 알림 시각
    UserTermsAgreementItemResponse:
      type: object
      description: 유저 약관 동의 항목
      properties:
        termId:
          type: integer
          format: int64
          description: 약관 ID
          example: 3
        termCode:
          type: string
          description: 약관 코드
          example: MARKETING
        title:
          type: string
          description: 약관 제목
          example: 마케팅 수신 동의
        contentPath:
          type: string
          description: 약관 본문 URL 경로
          example: /terms/marketing
        required:
          type: boolean
          description: 필수 여부
        agreed:
          type: boolean
          description: 동의 여부
        agreedAt:
          type: string
          format: date-time
          description: 동의 시각
        revokedAt:
          type: string
          format: date-time
          description: 철회 시각
    UserTermsAgreementsListResponse:
      type: object
      description: 유저 약관 동의 목록
      properties:
        agreements:
          type: array
          description: ACTIVE 약관별 동의 상태
          items:
            $ref: "#/components/schemas/UserTermsAgreementItemResponse"
    TermResponse:
      type: object
      description: 약관 항목
      properties:
        id:
          type: integer
          format: int64
          description: 약관 ID
          example: 1
        title:
          type: string
          description: 약관 제목
          example: 서비스 이용약관
        contentPath:
          type: string
          description: 약관 본문 URL 경로
          example: /terms/service
        termCode:
          type: string
          description: 약관 코드
          example: SERVICE
        version:
          type: string
          description: 약관 버전 (major.minor)
          example: "1.0"
        required:
          type: boolean
          description: 필수 여부
    TermsListResponse:
      type: object
      description: ACTIVE 약관 목록 응답
      properties:
        terms:
          type: array
          description: ACTIVE 약관 목록
          items:
            $ref: "#/components/schemas/TermResponse"
    UserWithdrawResponse:
      type: object
      description: 회원탈퇴 응답
      properties:
        code:
          type: string
          description: 결과 코드
          example: USER_S001
        message:
          type: string
          description: 결과 메시지
          example: 회원탈퇴가 완료되었습니다.
  securitySchemes:
    bearerAuth:
      type: http
      description: JWT Access Token
      scheme: bearer
      bearerFormat: JWT
