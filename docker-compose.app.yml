# 애플리케이션 컨테이너 SSOT — plip-develop-env docker-compose.services.yml include 대상
# 로컬 전체 기동은 docker-compose.yml (include) 사용
services:
  user:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plip-service-user
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-plip_user}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      JWT_SECRET: ${JWT_SECRET:-change-me-local-dev-only}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@plip.app}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED:-false}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://eureka-server:8761/eureka/}
      EUREKA_INSTANCE_HOSTNAME: user
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    networks:
      - plip-net
    develop:
      watch:
        - path: ./src/main
          action: rebuild
        - path: ./build.gradle
          action: rebuild

networks:
  plip-net:
    name: plip-net
